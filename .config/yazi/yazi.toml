[opener]
edit  = [ { run = "nvim %s", block = true, desc = "Neovim", for = "unix" } ]
image = [ { run = "imv %s", orphan = true, desc = "imv", for = "unix" } ]
pdf   = [ { run = "zathura %s", orphan = true, desc = "Zathura", for = "unix" } ]
play  = [ { run = "mpv %s", orphan = true, desc = "mpv", for = "unix" } ]

[open]
prepend_rules = [
  { mime = "image/*", use = [ "image", "open" ] },
  { mime = "application/pdf", use = [ "pdf", "open" ] },
  { mime = "{audio,video}/*", use = [ "play", "open" ] },
  { mime = "text/*", use = [ "edit", "open" ] },
  { mime = "application/{json,javascript,x-shellscript,toml,xml}", use = [ "edit", "open" ] },
]
