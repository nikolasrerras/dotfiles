# Dynamic colors generated by Wallust

# Font
font_size 12.0

# Window
window_padding_width 10
placement_strategy center

# Cursor
cursor_shape beam
cursor_blink_interval 0

# Scrollback
scrollback_lines 10000
scrollbar scrolled

include wallust.conf


# BEGIN_KITTY_FONTS
font_family      family="DepartureMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# Blur & Transparency
#background_opacity 0.90
#background_blur 1
#dynamic_background_opacity no



# transparency, written by `theme effects`
include effects.conf
