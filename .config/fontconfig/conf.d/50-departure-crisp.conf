<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Departure Mono: pixel font, render without antialiasing so it stays sharp at any size -->
<fontconfig>
  <match target="font">
    <test name="family" compare="contains"><string>DepartureMono</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintfull</const></edit>
  </match>
</fontconfig>
