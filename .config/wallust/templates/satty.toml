# satty config, generated by wallust (theme system)
[general]
fullscreen = false
early-exit = true
initial-tool = "arrow"
copy-command = "wl-copy"
output-filename = "~/Pictures/Screenshots/satty-%Y-%m-%d_%H-%M-%S.png"

[font]
family = "DepartureMono Nerd Font"

[color-palette]
palette = [
    "{{color1}}",
    "{{color3}}",
    "{{color2}}",
    "{{color4}}",
    "{{color5}}",
    "{{foreground}}",
]
