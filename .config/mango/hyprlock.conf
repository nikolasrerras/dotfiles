# hyprlock for mango: terminal-style lock screen (hyprlock --config ~/.config/mango/hyprlock.conf)
# colors and font come from hyprlock-colors.conf
source = ~/.config/mango/hyprlock-colors.conf
source = ~/.cache/mango-lock-font.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 3, linear
    animation = fadeOut, 1, 3, linear
    animation = inputFieldDots, 1, 2, linear
}

# the current wallpaper (linked by scripts/lock), blurred; falls back to the theme background
background {
    monitor =
    path = ~/.cache/mango-lock-wallpaper
    color = $bg
    blur_passes = 3
    blur_size = 8
}

# dark layer in the theme background colour over the blurred screen, so the text reads like a terminal
shape {
    monitor =
    size = 100%, 100%
    color = $dim
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# dark layer in the theme background colour over the blurred screen, so the text reads like a terminal
shape {
    monitor =
    size = 100%, 100%
    color = $dim
    rounding = 0
    position = 0, 0
    halign = center
    valign = center
}

# time and date
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 96
    font_family = $font
    position = 0, 220
    halign = center
    valign = center
}
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = $muted
    font_size = 22
    font_family = $font
    position = 0, 130
    halign = center
    valign = center
}

# user@host above the prompt, like a terminal
label {
    monitor =
    text = cmd[update:0] echo "$USER@$(uname -n)"
    color = $muted
    font_size = 18
    font_family = $font
    position = -173, 20
    halign = center
    valign = center
}

# the prompt, with the password field right after it
label {
    monitor =
    text = ~/lock ❯
    color = $accent
    font_size = 22
    font_family = $font
    position = -200, -33
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 360, 50
    outline_thickness = 0
    rounding = 0
    inner_color = rgba(0, 0, 0, 0.0)
    outer_color = $accent
    check_color = $accent
    fail_color = $red
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text =
    fail_text = $PAMFAIL ($ATTEMPTS)
    dots_text_format = *
    dots_center = false
    dots_spacing = 0.3
    position = 60, -40
    halign = center
    valign = center
}

# keyboard layout, since the password may need the right one
label {
    monitor =
    text = $LAYOUT
    color = $muted
    font_size = 14
    font_family = $font
    position = 0, 60
    halign = center
    valign = bottom
}
