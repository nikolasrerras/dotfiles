# starship: terminal-style prompt like the eww popups (~/audio ❯), extra info dim on the right
# left: ~/D/diploma/papers ❯      right: branch, python, duration

add_newline = true
format = '$directory $character'
right_format = '$git_branch$git_status( $python)( $cmd_duration)'

[directory]
format = '[$path]($style)[$read_only]($read_only_style)'
style = "cyan"
read_only = " "
truncation_length = 2
truncate_to_repo = false
fish_style_pwd_dir_length = 1

[git_branch]
format = '[$symbol$branch]($style)'
symbol = " "
style = "bright-black"

[git_status]
format = '[( $all_status$ahead_behind)]($style)'
style = "bright-black"

[python]
format = '[$symbol$version( \($virtualenv\))]($style)'
symbol = " "
style = "bright-black"

[cmd_duration]
format = '[⏱ $duration]($style)'
min_time = 2000
style = "bright-black"

[character]
success_symbol = "[❯](cyan)"
error_symbol = "[❯](red)"
