[main]
anchor=center
lines=10
width=40
horizontal-pad=25
vertical-pad=15
inner-pad=10

font=JetBrainsMono Nerd Font:size=12
show-icons=yes
icon-theme=Papirus-Dark  # Ή όποιο theme έχεις (π.χ. Adwaita)
prompt="~> "             # Εικονίδιο αναζήτησης

[colors]
background=282828d9
text=EBDBB2ff
match=8EC07Cff
selection=282828ff
selection-text=8EC07Cff
selection-match=8EC07Cff
border=8EC07Cff

[border]
width=3
radius=15  # Πιο στρογγυλεμένες γωνίες για "modern" look

[dmenu]
exit-immediately-if-empty=yes
