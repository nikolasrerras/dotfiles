# satty config, generated by wallust (theme system)
[general]
fullscreen = false
early-exit = true
corner-roundness = 4
initial-tool = "arrow"
copy-command = "wl-copy"
output-filename = "~/Pictures/Screenshots/satty-%Y-%m-%d_%H-%M-%S.png"

[font]
family = "Terminess Nerd Font"

[color-palette]
palette = [
    "#C26265",
    "#AD9B49",
    "#52AA60",
    "#487FD4",
    "#AF5BD1",
    "#B4BCCA",
]
