# satty config, generated by wallust (theme system)
[general]
fullscreen = false
early-exit = true
corner-roundness = 4
initial-tool = "arrow"
copy-command = "wl-copy"
output-filename = "~/Pictures/Screenshots/satty-%Y-%m-%d_%H-%M-%S.png"

[font]
family = "JetBrainsMono Nerd Font"

[color-palette]
palette = [
    "#C34043",
    "#C0A36E",
    "#76946A",
    "#7E9CD8",
    "#957FB8",
    "#DCD7BA",
]
