[main]
anchor=center
lines=10
width=40
horizontal-pad=25
vertical-pad=15
inner-pad=10

font=JetBrainsMono Nerd Font:size=12
show-icons=yes
icon-theme=Papirus-Dark  # Ή όποιο theme έχεις (π.χ. Adwaita)
prompt="~> "             # Εικονίδιο αναζήτησης

[colors]
background={{background | strip}}d9
text={{foreground | strip}}ff
match={{color14 | strip}}ff
selection={{color0 | strip}}ff
selection-text={{color14 | strip}}ff
selection-match={{color14 | strip}}ff
border={{color14 | strip}}ff

[border]
width=3
radius=15  # Πιο στρογγυλεμένες γωνίες για "modern" look

[dmenu]
exit-immediately-if-empty=yes
